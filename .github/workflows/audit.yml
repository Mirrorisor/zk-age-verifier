name: Audit

# Fork only: known vulnerabilities in what the service actually runs. The locked runtime
# dependencies are checked with pip-audit, and the built image (operating-system packages
# and anything else installed in it) with Trivy. Weekly, so a new advisory for a pinned
# package shows up without a push. The steps for a finding are in age-gate's docs/VERIFIER-MAINTENANCE.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Audit the locked runtime dependencies
        run: |
          uv export --frozen --no-hashes --no-dev --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --quiet --tag local/verifier .
      # Trivy pinned by digest (2026-11-19); its vulnerability database is fetched fresh.
      - name: Scan the image (fails on a fixable high or critical finding)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --quiet --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 local/verifier
