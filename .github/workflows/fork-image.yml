name: Fork image

# Fork only: builds the verifier image from this fork's main and publishes it to
# ghcr.io/<owner>/zk-age-verifier, so other projects can pull it instead of building.
# The upstream release workflow (release.yml) is untouched; it publishes only on version tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # the action lower-cases the repository name, as ghcr.io requires
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=fork
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          # pylongfellow ships x86_64 wheels only (see release.yml)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REF=${{ github.sha }}
